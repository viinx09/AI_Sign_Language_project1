{% extends "base.html" %}

{% block title %}Translation - AI Sign Language Translator{% endblock %}

{% block content %}
<section class="page-content">
    <h1>Real-Time Translation</h1>
    <div class="translation-container">
        <p id="status" class="status">Click "Start Camera" to begin</p>
        <div class="video-container">
            <video id="translationWebcam" autoplay playsinline style="width: 100%; max-width: 640px; border: 2px solid #3498db; border-radius: 8px;"></video>
        </div>
        <div class="controls">
            <button id="startTranslationBtn" class="btn-primary">Start Camera</button>
            <button id="stopTranslationBtn" class="btn-secondary">Stop Camera</button>
        </div>
        <div class="translation-output">
            <h3>Type Your Text:</h3>
            <textarea id="textToSpeak" class="text-box" style="min-height: 80px;">Hello! This is a test of the translation system.</textarea>
            <div class="controls" style="margin-top: 10px;">
                <label style="margin-right: 10px;">Select Voice:</label>
                <select id="voiceSelector" style="padding: 8px; border-radius: 4px; border: 1px solid #bdc3c7; margin-right: 10px;"></select>
                <button id="speakBtn" class="btn-primary">Speak Text</button>
            </div>
            <h3 style="margin-top: 30px;">Translated Text:</h3>
            <div id="translatedText" class="text-box" style="background-color: #f0f8ff;">Your sign language translations will appear here!</div>
        </div>
    </div>
</section>
{% endblock %}
